name: build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

env:
  BIN_NAME: slideshowsetuprust

jobs:
  build-linux-amd64:
    name: Linux amd64 (Debian)
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            git \
            pkg-config \
            perl

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp target/release/${BIN_NAME} dist/${BIN_NAME}-linux-amd64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: slideshowsetuprust-linux-amd64
          path: dist/slideshowsetuprust-linux-amd64

  build-linux-arm:
    name: Linux ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            label: arm64
          - target: armv7-unknown-linux-gnueabihf
            label: armv7

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Build
        run: cross build --release --target ${{ matrix.target }}

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${BIN_NAME} dist/${BIN_NAME}-linux-${{ matrix.label }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: slideshowsetuprust-linux-${{ matrix.label }}
          path: dist/slideshowsetuprust-linux-${{ matrix.label }}

  build-windows-amd64:
    name: Windows amd64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/${env:BIN_NAME}.exe dist/${env:BIN_NAME}-windows-amd64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: slideshowsetuprust-windows-amd64
          path: dist/slideshowsetuprust-windows-amd64.exe

  build-macos-intel:
    name: macOS amd64
    runs-on: macos-13

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Build
        run: cargo build --release --target x86_64-apple-darwin

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp target/x86_64-apple-darwin/release/${BIN_NAME} dist/${BIN_NAME}-macos-amd64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: slideshowsetuprust-macos-amd64
          path: dist/slideshowsetuprust-macos-amd64

  build-macos-arm64:
    name: macOS arm64
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build
        run: cargo build --release --target aarch64-apple-darwin

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/${BIN_NAME} dist/${BIN_NAME}-macos-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: slideshowsetuprust-macos-arm64
          path: dist/slideshowsetuprust-macos-arm64

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-linux-amd64
      - build-linux-arm
      - build-windows-amd64
      - build-macos-intel
      - build-macos-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*